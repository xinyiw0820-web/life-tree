<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>人生支点 · 一棵可以随便点点的树</title>
<meta name="description" content="一棵藏着有趣故事的树。随手点一下，遇见一件意想不到的事。">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%235f7d45' d='M26 6C14 6 7 12 7 21c0 2 .4 3.6 1 5l2-2c0-7 6-12 14-13-6 3-9 7-10 13l2 2c6-1 10-6 10-14V6z'/%3E%3C/svg%3E">
<style>
/* ============================================================
   人生支点 Mini V1.0
   一棵树 / 一次点击 / 一个值得记住的发现
   ============================================================ */

:root{
  --paper:#fbf6e9;
  --paper-2:#f6eedc;
  --ink:#2b2418;
  --ink-2:#6b6150;
  --ink-3:#9a8a6c;
  --line:rgba(120,95,55,.2);
  --k:#b07c22;   /* 奇妙世界 */
  --s:#8a5a2b;   /* 不同人生 */
  --a:#5f7d45;   /* 微小行动 */
  --garden:#a4556a;
  --serif:"Songti SC","Source Han Serif SC","Noto Serif SC","STSong","SimSun",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.2,.82,.26,1);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;overflow:hidden;background:#0b100e;color:var(--ink);
  font-family:var(--sans);-webkit-font-smoothing:antialiased;
}
button{font-family:inherit}

.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}

/* ---------- 开场：三拍，可跳过 ---------- */
.intro{
  position:fixed;inset:0;z-index:100;
  display:grid;place-items:center;
  overflow:hidden;
  background:radial-gradient(120% 90% at 50% 45%, #151c16 0%, #090c0a 70%);
  color:#f6ecd6;
  transition:opacity .9s ease, visibility 0s linear .9s;
}
.intro.hidden{opacity:0;visibility:hidden;pointer-events:none}
.intro:focus{outline:none}

.intro-glow{
  position:absolute;left:50%;top:50%;
  width:56vmax;height:56vmax;border-radius:50%;
  transform:translate(-50%,-50%) scale(.04);
  background:radial-gradient(circle,
    rgba(255,238,196,.55) 0%,
    rgba(255,226,166,.22) 32%,
    rgba(255,220,150,.06) 55%,
    transparent 72%);
  opacity:0;
  animation:glowGrow 4.4s cubic-bezier(.3,0,.2,1) forwards;
}
@keyframes glowGrow{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.04)}
  18%{opacity:.95}
  70%{opacity:.55}
  100%{opacity:.8;transform:translate(-50%,-50%) scale(1)}
}

.intro-line{
  position:absolute;left:50%;top:50%;
  margin:0;transform:translate(-50%,-50%);
  font-family:var(--serif);font-weight:500;
  font-size:clamp(24px,3.2vw,44px);
  letter-spacing:.18em;text-indent:.18em;
  color:#f8efda;opacity:0;white-space:nowrap;
  animation:lineIn 1.5s ease forwards;
}
.intro-line.one{animation-delay:.25s}
.intro-line.two{animation-delay:1.7s}
@keyframes lineIn{
  0%{opacity:0;transform:translate(-50%,-44%)}
  25%{opacity:1;transform:translate(-50%,-50%)}
  68%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-56%)}
}

.intro-brand{
  position:relative;z-index:2;
  text-align:center;opacity:0;
  animation:brandIn 1.2s ease 3.05s forwards;
}
.intro-brand h1{
  margin:0 0 16px;
  font-family:var(--serif);font-weight:600;
  font-size:clamp(40px,5.4vw,74px);
  letter-spacing:.2em;text-indent:.2em;
}
.intro-brand p{
  margin:0;font-size:13px;letter-spacing:.3em;
  color:rgba(246,236,214,.58);
}
@keyframes brandIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:none}
}

.intro-enter{
  margin-top:34px;padding:13px 36px;border-radius:999px;
  border:1px solid rgba(246,236,214,.36);
  background:rgba(246,236,214,.06);
  color:#f8efda;font-size:13.5px;letter-spacing:.2em;
  cursor:pointer;backdrop-filter:blur(6px);
  transition:background .25s,border-color .25s,transform .25s;
}
.intro-enter:hover{
  background:rgba(246,236,214,.16);
  border-color:rgba(246,236,214,.7);
  transform:translateY(-1px);
}
.intro-enter:focus-visible,
.intro-skip:focus-visible{
  outline:2px solid rgba(246,236,214,.55);
  outline-offset:3px;
}

.intro-skip{
  position:absolute;right:24px;bottom:22px;z-index:3;
  padding:8px 14px;border-radius:999px;
  border:1px solid rgba(246,236,214,.14);
  background:transparent;color:rgba(246,236,214,.5);
  font-size:11.5px;letter-spacing:.14em;cursor:pointer;
  transition:color .2s,border-color .2s;
}
.intro-skip:hover{color:#f6ecd6;border-color:rgba(246,236,214,.4)}

html.reduce-motion .intro{transition-duration:.01ms}
html.reduce-motion .intro-line{display:none}
html.reduce-motion .intro-glow{animation:none;opacity:.5;transform:translate(-50%,-50%) scale(1)}
html.reduce-motion .intro-brand{animation:none;opacity:1}

/* ---------- 世界与舞台 ---------- */
.world{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}

/* 宽屏时向左右延展：把同一张图放大模糊，填补两侧，而不是拉伸原图 */
.bg-blur{
  position:fixed;z-index:0;
  background:url("assets/tree.jpg") center center / 100% 100% no-repeat;
  filter:blur(58px) saturate(1.12) brightness(1.02);
  transform:scale(1.01);
}

.stage{
  position:relative;z-index:2;
  isolation:isolate;
  overflow:hidden;
  box-shadow:0 50px 140px -60px rgba(0,0,0,.85);
  animation:stageBreath 38s ease-in-out infinite alternate;
}
/* 镜头极慢地呼吸一下，几乎没有位移感，但画面不会死 */
@keyframes stageBreath{
  from{transform:scale(1)}
  to{transform:scale(1.006)}
}

.art{
  display:block;width:100%;height:100%;
  object-fit:cover;object-position:center;
  -webkit-user-drag:none;user-select:none;
  opacity:0;transition:opacity 1s ease;
}
body.ready .art{opacity:1}

/* 只在该方向真的有留白时才羽化边缘，避免 16:9 屏上白白吃掉画面 */
.world[data-bleed="x"] .art:not(.canopy){
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 3.2%,#000 96.8%,transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 3.2%,#000 96.8%,transparent 100%);
}
.world[data-bleed="y"] .art:not(.canopy){
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 3.2%,#000 96.8%,transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0,#000 3.2%,#000 96.8%,transparent 100%);
}

/* 树冠呼吸：同一张图再叠一层，只在树冠范围里露出，让它轻轻动 */
.canopy{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  transform-origin:66% 67%;
  -webkit-mask-image:radial-gradient(40% 34% at 63% 23%, #000 42%, rgba(0,0,0,.72) 62%, transparent 86%);
  mask-image:radial-gradient(40% 34% at 63% 23%, #000 42%, rgba(0,0,0,.72) 62%, transparent 86%);
  animation:canopySway 16s ease-in-out infinite;
  will-change:transform;
}
@keyframes canopySway{
  0%,100%{transform:rotate(0deg) scale(1)}
  26%{transform:rotate(.18deg) scale(1.006)}
  54%{transform:rotate(-.13deg) scale(1.004)}
  78%{transform:rotate(.07deg) scale(1.005)}
}

/* 阳光缓慢变化：只叠一层极淡的暖光，不改动原画 */
.sun{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(46% 38% at 38% 18%, rgba(255,238,196,.34), rgba(255,238,196,0) 70%);
  mix-blend-mode:screen;opacity:.55;
  animation:sunDrift 36s ease-in-out infinite alternate;
}
@keyframes sunDrift{
  from{transform:translate3d(-1.4%,0,0) scale(1)}
  to{transform:translate3d(1.8%,1.2%,0) scale(1.05)}
}

/* 云海上的雾：两层不同速度地漂，给画面一点纵深 */
.mist{
  position:absolute;inset:-6% -12%;z-index:2;pointer-events:none;
  filter:blur(22px);
  opacity:.7;
  translate:var(--mx2,0px) var(--my2,0px);
  transition:translate 1.6s cubic-bezier(.2,.7,.2,1);
}
.mist-a{
  background:
    radial-gradient(46% 18% at 30% 84%, rgba(255,252,246,.40), transparent 72%),
    radial-gradient(40% 15% at 74% 90%, rgba(255,247,228,.34), transparent 74%);
  animation:mistDrift 34s ease-in-out infinite alternate;
}
.mist-b{
  background:
    radial-gradient(36% 13% at 56% 76%, rgba(255,255,255,.24), transparent 74%),
    radial-gradient(28% 11% at 14% 68%, rgba(255,250,238,.20), transparent 78%);
  opacity:.52;
  animation:mistDrift 48s ease-in-out infinite alternate-reverse;
}
@keyframes mistDrift{
  from{transform:translate3d(-3.4%,0,0)}
  to{transform:translate3d(3.4%,0,0)}
}

/* 浮尘 */
.motes{position:absolute;inset:0;z-index:2;pointer-events:none;
  transform:translate3d(var(--mx,0px),var(--my,0px),0);
  transition:transform 1.2s cubic-bezier(.2,.7,.2,1);
}
.mote{
  position:absolute;border-radius:50%;background:rgba(255,244,206,.85);
  box-shadow:0 0 8px 1px rgba(255,232,168,.45);
  opacity:0;animation:drift var(--dur) linear infinite;animation-delay:var(--delay);
}
@keyframes drift{
  0%{transform:translate3d(0,0,0);opacity:0}
  20%{opacity:var(--o,.55)}
  80%{opacity:var(--o,.55)}
  100%{transform:translate3d(var(--dx,8px),var(--dy,-56px),0);opacity:0}
}

/* 起风：一道光扫过 */
.gust{
  position:absolute;inset:-8%;z-index:3;pointer-events:none;opacity:0;
  background:linear-gradient(104deg,transparent 36%,rgba(255,248,224,.34) 47%,rgba(255,251,236,.52) 52%,rgba(255,248,224,.26) 58%,transparent 70%);
  filter:blur(8px);
}
.stage.gusting .gust{animation:gust 1.05s cubic-bezier(.3,.6,.3,1)}
@keyframes gust{
  0%{opacity:0;transform:translateX(-36%)}
  38%{opacity:.85}
  100%{opacity:0;transform:translateX(36%)}
}

/* 落下的叶子 */
.leaf-fall{
  position:absolute;left:50%;top:8%;z-index:8;pointer-events:none;
  width:34px;height:34px;opacity:0;
  animation:leafFall 1.6s cubic-bezier(.35,.1,.55,1) forwards;
}
@keyframes leafFall{
  0%{opacity:0;transform:translate3d(0,0,0) rotate(0deg) scale(.9)}
  12%{opacity:.95}
  60%{transform:translate3d(var(--sway,-40px),34vh,0) rotate(160deg) scale(1)}
  100%{opacity:0;transform:translate3d(var(--sway2,30px),58vh,0) rotate(320deg) scale(.96)}
}

/* 平时偶尔飘下来的一片叶子 */
.leaf-fall.ambient{
  width:24px;height:24px;top:-6%;
  animation:leafDrift 9s linear forwards;
}
@keyframes leafDrift{
  0%{opacity:0;transform:translate3d(0,-6vh,0) rotate(0deg)}
  10%{opacity:.55}
  50%{transform:translate3d(var(--sway),45vh,0) rotate(210deg)}
  90%{opacity:.4}
  100%{opacity:0;transform:translate3d(var(--sway2),108vh,0) rotate(430deg)}
}

/* ---------- 叠在画稿上的真实按钮 ---------- */
.hit{
  position:absolute;left:calc(var(--x) * 1%);top:calc(var(--y) * 1%);
  width:calc(var(--w) * 1%);height:calc(var(--h) * 1%);
  transform:translate(-50%,-50%);
  padding:0;border:0;background:transparent;border-radius:999px;
  cursor:pointer;z-index:9;
  transition:background .25s ease,box-shadow .25s ease;
}
.hit:focus-visible{
  outline:2px solid rgba(255,248,226,.95);outline-offset:3px;
  background:rgba(255,246,224,.08);
}
.hit.nav:hover{background:rgba(255,248,226,.12)}
.hit.cta::after{
  content:"";position:absolute;inset:-3px;border-radius:999px;
  background:radial-gradient(circle at 50% 50%,rgba(255,244,204,.45),transparent 70%);
  opacity:0;transition:opacity .3s ease;pointer-events:none;
}
.hit.cta:hover::after,.hit.cta:focus-visible::after{opacity:1}

.seed-count{
  position:absolute;left:94.5%;top:1.9%;z-index:10;
  min-width:1.6em;height:1.6em;padding:0 .42em;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:clamp(9px,.72vw,12px);font-weight:600;line-height:1;
  color:#4a3a18;background:linear-gradient(180deg,#ffe9ad,#f5cf72);
  border-radius:999px;border:1px solid rgba(255,255,255,.78);
  box-shadow:0 2px 8px rgba(120,80,10,.32);
  transform:translateY(-50%);pointer-events:none;
  opacity:0;transition:opacity .3s ease;
}
.seed-count.on{opacity:1}

/* ---------- 长椅上的小鸟 ---------- */
.bird{
  position:absolute;left:63.2%;top:64.6%;z-index:6;
  width:3.35%;transform:translate(-50%,-50%);
  filter:drop-shadow(0 3px 4px rgba(40,24,6,.35));
  pointer-events:none;opacity:.94;
  animation:birdBreathe 7s ease-in-out infinite;
}
@keyframes birdBreathe{
  0%,100%{transform:translate(-50%,-50%) rotate(0deg)}
  42%{transform:translate(-50%,-50.6%) rotate(-1.2deg)}
  45%{transform:translate(-50%,-53.2%) rotate(-2.6deg)}
  48%{transform:translate(-50%,-50%) rotate(.7deg)}
  70%{transform:translate(-50%,-49.8%) rotate(.8deg)}
}


/* ---------- 热点 ---------- */
.hotspots{position:absolute;inset:0;z-index:5}
.hotspot{
  position:absolute;width:5.5%;aspect-ratio:1;
  transform:translate(-50%,-50%);
  padding:0;border:0;background:none;cursor:pointer;border-radius:50%;
  -webkit-tap-highlight-color:transparent;
}
.hs-ring{
  position:absolute;inset:0;border-radius:50%;
  border:1px solid rgba(255,248,226,0);
  background:radial-gradient(circle,rgba(255,244,214,.08),transparent 68%);
  transition:border-color .32s ease,box-shadow .4s ease,transform .4s var(--ease);
}
.hotspot[data-ring="true"] .hs-ring{
  border-color:rgba(255,248,226,.16);
  box-shadow:0 0 16px rgba(255,238,190,.08);
}
.hotspot:hover .hs-ring,.hotspot:focus-visible .hs-ring{
  border-color:rgba(255,250,232,.9);
  background:radial-gradient(circle,rgba(255,244,214,.14),transparent 70%);
  box-shadow:0 0 30px rgba(255,228,160,.45),inset 0 0 26px rgba(255,238,190,.2);
  transform:scale(1.05);
}
.hotspot:focus-visible{outline:none}
.hotspot:focus-visible .hs-ring{border-width:2px}

/* 果实偶尔闪一下 */
.hs-spark{
  position:absolute;inset:-12%;border-radius:50%;pointer-events:none;
  border:1px solid rgba(255,238,190,.5);opacity:0;
  animation:spark 9s ease-out infinite;animation-delay:var(--sd,0s);
}
@keyframes spark{
  0%,86%{opacity:0;transform:scale(.82)}
  90%{opacity:.55}
  100%{opacity:0;transform:scale(1.22)}
}

.hs-tip{
  position:absolute;left:50%;top:calc(100% + 9px);
  transform:translate(-50%,-6px);
  width:max-content;max-width:214px;
  padding:10px 12px 9px;border-radius:10px;
  background:rgba(37,30,19,.8);
  border:1px solid rgba(255,242,204,.22);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 14px 34px -12px rgba(0,0,0,.55);
  color:#fff8e6;text-align:left;
  opacity:0;pointer-events:none;
  transition:opacity .22s ease,transform .28s var(--ease);
}
.hs-tip::before{
  content:"";position:absolute;left:50%;bottom:100%;margin-left:-5px;
  border:5px solid transparent;border-bottom-color:rgba(37,30,19,.8);
}
.hs-tip b{
  display:block;margin-bottom:3px;
  font-family:var(--serif);font-weight:600;font-size:12.5px;
  letter-spacing:.06em;line-height:1.4;
}
.hs-tip i{
  display:block;font-style:normal;
  font-size:10.5px;line-height:1.65;letter-spacing:.02em;
  color:rgba(255,244,220,.66);
}
/* 靠下的热点，提示翻到上方，免得被画面底边裁掉 */
.hotspot[data-pos="up"] .hs-tip{
  top:auto;bottom:calc(100% + 9px);
  transform:translate(-50%,6px);
}
.hotspot[data-pos="up"] .hs-tip::before{
  bottom:auto;top:100%;
  border-bottom-color:transparent;border-top-color:rgba(37,30,19,.8);
}
.hotspot:hover .hs-tip,
.hotspot:focus-visible .hs-tip{opacity:1;transform:translate(-50%,0)}

/* ---------- 第一次来的提示 ---------- */
.hint{
  position:absolute;left:50%;bottom:8%;z-index:11;
  transform:translate(-50%,8px);
  padding:9px 16px;border-radius:999px;white-space:nowrap;
  font-size:clamp(10.5px,.82vw,13px);letter-spacing:.06em;
  color:#fff6e2;background:rgba(38,31,20,.62);
  border:1px solid rgba(255,240,200,.2);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;transition:opacity .6s ease,transform .6s var(--ease);
}
.hint.on{opacity:1;transform:translate(-50%,0)}

/* ---------- 内容页：停在屏幕正中，约占 2/3 ---------- */
.scrim{
  position:fixed;inset:0;z-index:35;
  background:rgba(9,13,10,.36);
  opacity:0;pointer-events:none;
  transition:opacity .35s ease;
}
.scrim.on{opacity:1;pointer-events:auto}

.card{
  position:fixed;z-index:40;left:50%;top:50%;
  transform:translate(-50%,-50%);
  border:1px solid var(--line);border-radius:5px;
  background:linear-gradient(180deg,#fffdf7 0%,#f9f2e2 100%);
  box-shadow:
    0 60px 130px -50px rgba(30,18,2,.7),
    0 1px 0 rgba(255,255,255,.9) inset;
  animation:cardIn .42s var(--ease);
  overflow:hidden;
  scrollbar-width:thin;scrollbar-color:rgba(140,110,60,.25) transparent;
}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:rgba(140,110,60,.22);border-radius:99px}

@keyframes cardIn{
  from{opacity:0;transform:translate(-50%,-50%) scale(.965)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}
}

.card::before{
  content:"";position:absolute;left:0;top:0;right:0;height:2px;z-index:2;
  background:linear-gradient(90deg,var(--accent,#b07c22),rgba(176,124,34,0) 70%);
}

/* 内容页：左侧播放器，右侧文字 */
.card.is-page{
  width:min(78vw,1180px);
  height:min(80vh,740px);
  min-height:540px;
  display:flex;flex-direction:column;
}

.video-grid{
  flex:1;min-height:0;
  display:grid;
  grid-template-columns:minmax(360px,54%) minmax(340px,46%);
  /* 关键：把行高限制在容器内，左右两栏的 overflow 才会真的生效 */
  grid-template-rows:minmax(0,1fr);
}

.video-left{
  display:flex;flex-direction:column;
  padding:42px 26px 24px 44px;
  border-right:1px solid rgba(120,95,55,.12);
  overflow-y:auto;
  scrollbar-gutter:stable;
}
.video-right{
  padding:42px 44px 26px 26px;
  overflow-y:auto;
  scrollbar-gutter:stable;
}
/* 视频页的标题稍小一点，给下面的结构化内容留出空间 */
.card.is-video .card-title{
  font-size:clamp(24px,2.1vw,31px);line-height:1.42;margin-bottom:18px;
}
.card.is-video .card-body{margin-bottom:22px}
.card.is-video .blk{margin-top:18px}
.card.is-video .tl{margin-bottom:13px}
.card.is-video .qt{margin-top:13px}

/* 没有视频的条目：单栏阅读页，别留一个空左栏 */
.card.is-page.no-video{width:min(66vw,880px)}
.card.is-page.no-video .video-grid{
  display:block;overflow-y:auto;min-height:0;
  scrollbar-gutter:stable;
}
.card.is-page.no-video .video-left{display:none}
.card.is-page.no-video .video-right{
  padding:46px 56px 28px;max-width:780px;margin:0 auto;
  overflow:visible;
}

/* 播放器 */
.player{
  position:relative;width:100%;aspect-ratio:16/9;
  background:#141210;border-radius:8px;overflow:hidden;
  box-shadow:0 16px 36px -22px rgba(0,0,0,.65);
}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* 先给一张封面，点了才加载播放器，避免平台自动播放 */
.player-cover{
  position:absolute;inset:0;width:100%;height:100%;
  display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;
  padding:22px 24px;border:0;cursor:pointer;text-align:left;
  background:
    radial-gradient(55% 55% at 78% 16%, rgba(214,166,96,.20), transparent 70%),

  content:"";position:absolute;left:3px;top:3px;width:15px;height:15px;border-radius:50%;

<body>

<!-- 开场：两句话，然后推门进去；随时可跳过 -->
<div class="intro" id="intro" role="dialog" aria-modal="true" aria-label="开场" tabindex="-1">

<h1 class="sr-only">人生支点</h1>

<script>
/* ============================================================
   1. 内容库：四个板块，每个板块 5 条，共 20 条
   board: skill / person / interview / video
   视频与文字来源均已核实；英文表达取自 TED 官方文字稿
   ============================================================ */

const BOARDS = {
  skill:     { name:'学习一项技能', color:'#b07c22' },
  person:    { name:'认识一个人物', color:'#8a5a2b' },
  interview: { name:'随机一则访谈', color:'#5f7d45' },
  video:     { name:'随机英文视频', color:'#4f6473' }
};

const state = { seeds:[], seen:[], hidden:[], finished:[], motion:'auto' };

const validIds = list => Array.isArray(list) ? list.filter(id=>CONTENT.some(c=>c.id===id)) : null;

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    const s = JSON.parse(raw);
    const seeds = validIds(s.seeds);      if(seeds) state.seeds = seeds;
    const seen = validIds(s.seen);        if(seen) state.seen = seen;
    const hidden = validIds(s.hidden);    if(hidden) state.hidden = hidden;
    const finished = validIds(s.finished); if(finished) state.finished = finished;
    if(s.motion === 'reduce' || s.motion === 'full') state.motion = s.motion;
  }catch(e){}
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
}

   4. 基础
   ============================================================ */

const $$ = (s,r=document)=>[...r.querySelectorAll(s)];

/* ============================================================
   5. 舞台尺寸：让画稿完整显示，宽屏两侧用模糊延展
   ============================================================ */

function fitStage(){
  const vw = innerWidth, vh = innerHeight;
  let w = vw, h = w / RATIO;
  if(h > vh){ h = vh; w = h * RATIO; }
  stage.style.width  = Math.round(w) + 'px';
  stage.style.height = Math.round(h) + 'px';

  // 模糊底图与舞台同尺寸：让模糊从画面自身的边缘往外渗，颜色才接得上
  const bw = w, bh = h;
  bgBlur.style.width  = Math.round(bw) + 'px';
  bgBlur.style.height = Math.round(bh) + 'px';
  bgBlur.style.left   = Math.round((vw - bw) / 2) + 'px';
  bgBlur.style.top    = Math.round((vh - bh) / 2) + 'px';

  const viewRatio = vw / vh;
  world.dataset.bleed = viewRatio > RATIO + .004 ? 'x'
                      : viewRatio < RATIO - .004 ? 'y'
                      : '';
}
addEventListener('resize', fitStage);

/* ============================================================
   6. 浮尘
   ============================================================ */

function makeMotes(){
  let seed = 19981101;
  const rnd = ()=> (seed = (seed*16807) % 2147483647) / 2147483647;
  let html = '';
  for(let i=0;i<9;i++){
    const size = 1.4 + rnd()*2.2;
    html += `<span class="mote" style="
      left:${(8+rnd()*84).toFixed(2)}%;
      top:${(24+rnd()*64).toFixed(2)}%;
      width:${size.toFixed(1)}px;height:${size.toFixed(1)}px;
      --dx:${(rnd()*30-15).toFixed(0)}px;
      --dy:${(-40-rnd()*70).toFixed(0)}px;
      --dur:${(18+rnd()*18).toFixed(1)}s;
      --delay:${(-rnd()*30).toFixed(1)}s;
      --o:${(.22+rnd()*.34).toFixed(2)};
    "></span>`;
  }
  motesEl.innerHTML = html;
}

hotspotsEl.addEventListener('click', e=>{
  const el = e.target.closest('.hotspot');
  if(!el) return;
  e.stopPropagation();
  const h = HOTSPOTS.find(x=>x.id===el.dataset.hotspot);
  if(!h) return;
  if(h.board === 'garden'){ openGarden(el); return; }
  const node = pickByBoard(h.board);
  if(node) openCard(node.id, el);
  else toast('这个板块的内容都被你收起来了');
});

function pickByBoard(board){
  const all = CONTENT.filter(n=>n.board===board && !state.hidden.includes(n.id));
  if(!all.length) return null;
  const unseen = all.filter(n=>!state.seen.includes(n.id));
  const pool = unseen.length ? unseen : all;
  return pool[Math.floor(Math.random()*pool.length)];
}

/* 卡片居中后不再需要避让，只让放大动画从你点的那个东西的方向长出来 */
function setOrigin(card, anchor){
  if(!anchor || !anchor.getBoundingClientRect) return;
  const r = anchor.getBoundingClientRect();
  const w = card.offsetWidth, h = card.offsetHeight;
  const ox = Math.max(-120, Math.min(w + 120, r.left + r.width/2 - (innerWidth - w)/2));
  const oy = Math.max(-120, Math.min(h + 120, r.top + r.height/2 - (innerHeight - h)/2));
  card.style.transformOrigin = `${ox}px ${oy}px`;
}

function showScrim(){ $('#scrim').classList.add('on'); }
function hideScrim(){ $('#scrim').classList.remove('on'); }

function centerAnchor(){
  return {
    getBoundingClientRect(){
      const r = stage.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;
      return { left:cx, top:cy, right:cx, bottom:cy, width:0, height:0 };
    }
  };
}

function closeCard(){
  if(!cardHost.firstElementChild) return;
  cardHost.innerHTML = '';
  hideScrim();
  currentAnchor = null;
  currentId = null;
  if(lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true});
  lastFocus = null;
}

/* 不感兴趣：永久移出内容池，种子和记录也一并清掉 */
function hideItem(id){
  if(!state.hidden.includes(id)) state.hidden.push(id);
  state.seeds = state.seeds.filter(x=>x!==id);
  state.finished = state.finished.filter(x=>x!==id);
  save();
  renderSeedCount();
  closeCard();
  toast('好，这条不会再出现了');
}

/* 已看完：记一笔，然后随机换一条；以后仍可能被随机抽到 */
function finishItem(id){
  if(!state.finished.includes(id)) state.finished.push(id);
  save();
  const next = pickRandom(id);
  if(next){ openCard(next.id, centerAnchor()); toast('已看完 · 换一条'); }
  else { closeCard(); toast('内容都被你收起来了'); }
}

/* ============================================================
   11. 随机：听听风怎么说
   ============================================================ */

let windLock = false;
let ambientTimer = 0;

function wind(){
  if(windLock) return;
  windLock = true;

  const node = pickRandom();
  const anchor = centerAnchor();
  const reduce = isReduced();

  if(!reduce){
    stage.classList.add('gusting');
    fallLeaf();
    setTimeout(()=>stage.classList.remove('gusting'), 1200);
    setTimeout(()=>openCard(node.id, anchor), 430);
    setTimeout(()=>{ windLock = false; }, 1300);
  }else{
    openCard(node.id, anchor);
    setTimeout(()=>{ windLock = false; }, 400);
  }
}

function pickRandom(excludeId){
  const avail = CONTENT.filter(n=>!state.hidden.includes(n.id));
  if(!avail.length){ toast('内容都被你收起来了'); return null; }

  let pool = avail.filter(n=>!state.seen.includes(n.id) && n.id !== excludeId);
  if(!pool.length){
    state.seen = [];
    save();
    pool = avail.filter(n=>n.id !== excludeId);
    toast('这一轮都看过了，风又吹了一遍');
  }
  if(!pool.length) pool = avail;

  // 60% 来自你的偏好方向，40% 来自陌生领域（随机惊喜）
  const isSurprise = n => (n.tags || []).includes('surprise');
  const prefer = Math.random() < 0.6;
  const preferredPool = pool.filter(n => !isSurprise(n));
  const surprisePool  = pool.filter(n => isSurprise(n));
  let source = prefer ? preferredPool : surprisePool;
  if(!source.length) source = pool;

  const boards = ['skill','person','interview','video'].filter(b=>source.some(n=>n.board===b));
  const b = boards[Math.floor(Math.random()*boards.length)];
  const pool2 = source.filter(n=>n.board===b);
  return pool2[Math.floor(Math.random()*pool2.length)];
}

function leafSvg(){
  return `<svg viewBox="0 0 32 32" fill="none">
    <path d="M27 5C14 5 5 12 5 22c0 3 1 5 2 6 9 1 18-5 20-16 .3-2 .4-4 0-7Z" fill="#9db885" opacity=".9"/>
    <path d="M8 26C12 18 18 12 26 7" stroke="#5f7d45" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>
  </svg>`;
}

function fallLeaf(){
  const leaf = document.createElement('div');
  leaf.className = 'leaf-fall';
  leaf.style.left = (24 + Math.random()*52) + '%';
  leaf.style.setProperty('--sway', (Math.random()*80-40).toFixed(0) + 'px');
  leaf.style.setProperty('--sway2', (Math.random()*120-60).toFixed(0) + 'px');
  leaf.innerHTML = leafSvg();
  stage.appendChild(leaf);
  setTimeout(()=>leaf.remove(), 1700);
}

/* 平时每隔几秒飘一片，让画面一直是活的 */
function ambientLeaf(){
  const leaf = document.createElement('div');
  leaf.className = 'leaf-fall ambient';
  leaf.style.left = (6 + Math.random()*88) + '%';
  leaf.style.setProperty('--sway', (Math.random()*120-60).toFixed(0) + 'px');
  leaf.style.setProperty('--sway2', (Math.random()*180-90).toFixed(0) + 'px');
  leaf.innerHTML = leafSvg();
  stage.appendChild(leaf);
  setTimeout(()=>leaf.remove(), 9300);
}

function scheduleAmbientLeaf(){
  clearTimeout(ambientTimer);
  if(isReduced()) return;
  ambientTimer = setTimeout(()=>{
    if(!document.hidden && !cardHost.firstElementChild) ambientLeaf();
    scheduleAmbientLeaf();
  }, 5500 + Math.random()*6500);
}

/* ============================================================
   12. 动效偏好
   ============================================================ */

function isReduced(){
  if(state.motion === 'reduce') return true;
  if(state.motion === 'full') return false;
  return mqReduce.matches;
}
function applyMotion(){
  const reduced = isReduced();
  document.documentElement.classList.toggle('reduce-motion', reduced);
  scheduleAmbientLeaf();
}
mqReduce.addEventListener?.('change', ()=>{ if(state.motion==='auto') applyMotion(); });

/* 鼠标轻微推动浮尘——只动前景，不动画稿，热点永远不跑偏 */
stage.addEventListener('pointermove', e=>{
  if(isReduced()) return;
  const r = stage.getBoundingClientRect();
  const dx = (e.clientX - r.left) / r.width - .5;
  const dy = (e.clientY - r.top) / r.height - .5;
  motesEl.style.setProperty('--mx', (dx * -12).toFixed(1) + 'px');
  motesEl.style.setProperty('--my', (dy * -8).toFixed(1) + 'px');
  stage.style.setProperty('--mx2', (dx * 16).toFixed(1) + 'px');
  stage.style.setProperty('--my2', (dy * 10).toFixed(1) + 'px');
});
stage.addEventListener('pointerleave', ()=>{
  motesEl.style.setProperty('--mx','0px');
  motesEl.style.setProperty('--my','0px');
  stage.style.setProperty('--mx2','0px');
  stage.style.setProperty('--my2','0px');
});

/* ============================================================
   13. 事件
   ============================================================ */

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if(!el) {
    // 点空白处收起卡片
    if(!e.target.closest('.card')) closeCard();
    return;
  }
  const act = el.dataset.act;

  switch(act){
    case 'home':    closeCard(); break;
    case 'wind':    e.stopPropagation(); wind(); break;
    case 'garden':  e.stopPropagation(); openGarden(el); break;
    case 'settings':e.stopPropagation(); openSettings(el); break;
    case 'close':   closeCard(); break;
    case 'seed':    toggleSeed(el.dataset.id); break;
    case 'play': {
      const node = byId(el.dataset.id);
      const wrap = el.closest('.player');
      if(node && node.video && wrap){
        wrap.innerHTML = `<iframe src="${esc(embedSrc(node.video, true))}"
          title="${esc(node.video.title || '视频')}" allowfullscreen
          allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
          referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
        wrap.querySelector('iframe').focus();
      }
      break;
    }
    case 'again': {
      const next = pickRandom(currentId);
      if(next) openCard(next.id, currentAnchor || centerAnchor());
      else closeCard();
      break;
    }
    case 'hide': {
      hideItem(el.dataset.id || currentId);
      break;
    }
    case 'finished': {
      finishItem(el.dataset.id || currentId);
      break;
    }
    case 'open-seed': {
      if(e.target.closest('[data-act="unseed"]')) return;
      const rectAnchor = { getBoundingClientRect: ()=> el.getBoundingClientRect() };
      openCard(el.dataset.id, rectAnchor);
      break;
    }
    case 'unseed': {
      e.stopPropagation();
      const id = el.dataset.id;
      const i = state.seeds.indexOf(id);
      if(i > -1) state.seeds.splice(i,1);
      save(); renderSeedCount();
      openGarden(currentAnchor);
      toast('种子已收回');
      break;
    }
    case 'toggle-motion': {
      state.motion = isReduced() ? 'full' : 'reduce';
      save(); applyMotion();
      el.setAttribute('aria-pressed', String(isReduced()));
      $$('.mini-btn[data-act="toggle-motion"], .set-row[data-act="toggle-motion"]').forEach(b=>{
        b.setAttribute('aria-pressed', String(isReduced()));
      });
      break;
    }
    case 'reset': {
      state.seeds = []; state.seen = []; state.hidden = []; state.finished = []; save();
      renderSeedCount(); closeCard();
      toast('都忘掉了，树还是原来那棵');
      break;
    }
    case 'restore-hidden': {
      state.hidden = []; save();
      closeCard();
      toast('都放回来了，下次可能再遇到');
      break;
    }
    case 'replay-intro': {
      try{ sessionStorage.removeItem('la.introSeen'); }catch(e){}
      location.reload();
      break;
    }
  }
});

/* 种子行的键盘操作 */
cardHost.addEventListener('keydown', e=>{
  if(e.key !== 'Enter' && e.key !== ' ') return;
  const row = e.target.closest('.seed-row');
  if(!row || e.target.closest('.x')) return;
  e.preventDefault();
  const rectAnchor = { getBoundingClientRect: ()=> row.getBoundingClientRect() };
  openCard(row.dataset.id, rectAnchor);
});

document.addEventListener('keydown', e=>{
  if(e.key === 'Escape'){ closeCard(); }
  if(e.key === 'Tab' && cardHost.firstElementChild){
    const f = $$('a[href],button:not([disabled]),[tabindex]:not([tabindex="-1"])', cardHost.firstElementChild)
      .filter(x=>x.offsetParent !== null);
    if(!f.length) return;
    const first = f[0], last = f[f.length-1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});

/* ============================================================
   14. Toast / 首次提示
   ============================================================ */

let toastTimer = 0;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove('on'), 2300);
}

/* ============================================================
   15. 启动
   ============================================================ */

load();
applyMotion();
renderSeedCount();
renderHotspots();
makeMotes();
fitStage();

if(art.complete && art.naturalWidth) document.body.classList.add('ready');
art.addEventListener('load', ()=> document.body.classList.add('ready'));
art.addEventListener('error', ()=>{
  document.body.classList.add('ready');
  toast('没找到 assets/tree.jpg，先用水色撑住画面');
});

/* 开场：两句话，然后推门进去；随时可跳过 */
const introEl = $('#intro');
function enterSite(){
  if(!introEl || introEl.classList.contains('hidden')) return;
  introEl.classList.add('hidden');
  try{ sessionStorage.setItem('la.introSeen','1'); }catch(e){}
  setTimeout(()=>{ introEl.style.display = 'none'; introEl.blur(); }, 1000);
}
try{
  // 带 ?c= 的分享链接直接进内容，不要被开场挡住
  const deep = new URLSearchParams(location.search).get('c');
  if(sessionStorage.getItem('la.introSeen') === '1' || deep){
    introEl.classList.add('hidden');
    introEl.style.display = 'none';
  }
}catch(e){}
introEl?.addEventListener('click', enterSite);
document.addEventListener('keydown', e=>{
  if(!introEl || introEl.classList.contains('hidden')) return;
  if(e.key === 'Escape' || e.key === 'Enter' || e.key === ' '){
    e.preventDefault();
    enterSite();
  }
});
setTimeout(()=>{
  if(introEl && !introEl.classList.contains('hidden')){
    introEl.focus({preventScroll:true});
  }
}, 3200);

/* 深链：?c=内容 id 直接打开某一条（也方便分享） */
try{
  const openId = new URLSearchParams(location.search).get('c');
  if(openId && byId(openId)) setTimeout(()=>openCard(openId, centerAnchor()), 280);
}catch(e){}

try{
  if(!localStorage.getItem('lifeanchors.hinted')){
    localStorage.setItem('lifeanchors.hinted','1');
    setTimeout(()=>{
      if(!cardHost.firstElementChild){
        hintEl.classList.add('on');
        setTimeout(()=>hintEl.classList.remove('on'), 9000);
      }
    }, 2200);
  }
}catch(e){}
</script>
